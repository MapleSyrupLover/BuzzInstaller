[package]
name = "buzz_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "BuzzInstaller core: BZ:// link parsing, chunk planning, hashing, transfers"
license-file = "../LICENSE"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# Enabled only after `flutter_rust_bridge_codegen generate` has run.
bridge = ["dep:flutter_rust_bridge"]

[dependencies]
regex = "1"
sha2 = "0.10"
thiserror = "2"
flutter_rust_bridge = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
