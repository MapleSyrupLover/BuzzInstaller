name: buzzinstaller_mobile
description: "BuzzInstaller Mobile — upload and download BuzzHeavier links from your phone."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.0.0
  file_selector: ^1.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#5865F2"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
